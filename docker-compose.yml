services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nimb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimb}
      POSTGRES_DB: nimb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimb"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL_CONTAINER:-postgresql://nimb:nimb@db:5432/nimb?schema=public}
      APP_ORIGIN: ${COMPOSE_APP_ORIGIN:-http://localhost:8081}
      NODE_ENV: ${COMPOSE_NODE_ENV:-development}
      PORT: 3000
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      SMTP_HOST: mail
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-nimb <noreply@example.test>}
      S3_ENDPOINT: http://storage:9090
      S3_REGION: us-east-1
      S3_BUCKET: nimb
      S3_ACCESS_KEY: local
      S3_SECRET_KEY: local
      S3_CREATE_BUCKET: "true"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.test}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
      mail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/me').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
  storage:
    image: adobe/s3mock:3.12.0
    environment:
      initialBuckets: nimb
      retainFilesOnExit: "true"
      root: /data
    ports:
      - "127.0.0.1:9000:9090"
    volumes:
      - object_data:/data
  mail:
    image: axllent/mailpit:v1.22
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:
  object_data:
