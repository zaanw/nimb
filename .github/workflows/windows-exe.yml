name: Build Nimb Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check project source
        shell: pwsh
        run: |
          if (!(Test-Path 'package.json')) { throw 'Nimb source files are not in repository yet.' }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows portable EXE
        run: npm run build:desktop
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nimb-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
